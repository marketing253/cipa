<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        # /admin, /totem, /inscricao, /foto/... (tudo que não é arquivo) vão para o index.php
        FallbackResource /index.php
        AddType application/manifest+json .webmanifest
    </Directory>

    <Directory /data>
        Require all denied
    </Directory>

    # respostas da API e a página compactadas (a lista de colaboradores e a cédula encolhem bem)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html application/json text/css application/javascript application/manifest+json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
