; Produção: erro vai para o log, nunca para a tela.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
date.timezone = America/Sao_Paulo
default_charset = "UTF-8"
; importação da lista de colaboradores e fotos vão no corpo JSON
post_max_size = 16M
memory_limit = 256M
max_execution_time = 60
opcache.enable = 1
opcache.validate_timestamps = 0